<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grafik Masası</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="symBtn" class="tb-btn tb-sym" title="Sembol ara — grafikteyken bir harf yazman da yeter">
      <svg viewBox="0 0 18 18" width="18" height="18"><circle cx="7.5" cy="7.5" r="5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M11.3 11.3 16 16" stroke="currentColor" stroke-width="1.4"/></svg>
      <span id="symText">—</span>
    </button>
    <span class="tb-sep"></span>
    <div id="ivBox" class="tb-group"></div>
    <span class="tb-sep"></span>
    <div id="typeBox" class="tb-group"></div>
    <span class="tb-sep"></span>
    <button id="undoBtn" class="tb-btn tb-icon" title="Geri al (Ctrl+Z)">
      <svg viewBox="0 0 28 28" width="28" height="28"><path d="M9 9 5.5 12.5 9 16M6 12.5h10a5 5 0 0 1 0 10h-3" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
    </button>
    <button id="redoBtn" class="tb-btn tb-icon" title="Yinele (Ctrl+Y)">
      <svg viewBox="0 0 28 28" width="28" height="28"><path d="M19 9l3.5 3.5L19 16M22 12.5H12a5 5 0 0 0 0 10h3" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
    </button>
    <div class="tb-fill"></div>
    <span id="drawCount" class="tb-status"></span>
    <span id="saveState" class="tb-status"></span>
    <button id="settingsBtn" class="tb-btn tb-icon" title="Ayarlar (EVDS anahtarı, TRM1/TRM2)">
      <svg viewBox="0 0 28 28" width="28" height="28"><circle cx="14" cy="14" r="3" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M14 4.5v3M14 20.5v3M4.5 14h3M20.5 14h3M7.3 7.3l2.1 2.1M18.6 18.6l2.1 2.1M7.3 20.7l2.1-2.1M18.6 9.4l2.1-2.1" stroke="currentColor" stroke-width="1.3"/><circle cx="14" cy="14" r="6.5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
    </button>
    <button id="helpBtn" class="tb-btn tb-icon" title="Kısayollar">
      <svg viewBox="0 0 28 28" width="28" height="28"><circle cx="14" cy="14" r="9" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M11.5 11.5a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1.9-1.1 1.8v.5" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="14" cy="19" r=".9" fill="currentColor"/></svg>
    </button>
  </header>

  <nav id="tools"></nav>

  <main id="center">
    <div id="chartWrap">
      <div id="chart"></div>
      <div id="legend">
        <div class="lg-title"><span id="lgSym"></span><span class="lg-dot">·</span><span id="lgIv"></span><span class="lg-dot">·</span><span id="lgSrc"></span></div>
        <div id="lgVals"></div>
      </div>
      <div id="drawBar" hidden></div>
      <div id="palette" hidden></div>
      <div id="overlay" hidden></div>
    </div>
    <footer id="bottombar">
      <div id="rangeBox" class="tb-group"></div>
      <div class="tb-fill"></div>
      <span id="clock" class="bb-clock"></span>
      <span class="tb-sep"></span>
      <button id="extBtn" class="bb-btn" title="Piyasa öncesi / sonrası (uzatılmış seans): gün içi grafiklerde o saatlerin mumları, watchlist'te fiyatı">ETH</button>
      <span class="tb-sep"></span>
      <button id="pctBtn" class="bb-btn" title="Yüzde ölçeği">%</button>
      <button id="logBtn" class="bb-btn" title="Logaritmik ölçek">log</button>
      <button id="autoBtn" class="bb-btn" title="Otomatik ölçek">auto</button>
    </footer>
  </main>

  <aside id="right">
    <div class="wl-head">
      <span class="wl-title">Watchlist <svg viewBox="0 0 18 18" width="14" height="14"><path d="M5 7l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></span>
      <div class="tb-fill"></div>
      <button id="wlAdd" class="tb-btn tb-icon" title="Sembol ekle">
        <svg viewBox="0 0 28 28" width="28" height="28"><path d="M14 7v14M7 14h14" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
      <button id="wlMenuBtn" class="tb-btn tb-icon" title="Diğer">
        <svg viewBox="0 0 28 28" width="28" height="28"><circle cx="8" cy="14" r="1.4" fill="currentColor"/><circle cx="14" cy="14" r="1.4" fill="currentColor"/><circle cx="20" cy="14" r="1.4" fill="currentColor"/></svg>
      </button>
      <div id="wlMenu" class="menu" hidden>
        <button data-act="group">Yeni bölüm ekle</button>
        <button data-act="refresh">Fiyatları yenile</button>
        <button data-act="csv">CSV içe aktar…</button>
      </div>
      <input type="file" id="csvFile" accept=".csv,.txt,text/csv" hidden>
    </div>
    <div class="wl-cols"><span>Symbol</span><span>Last</span><span>Chg</span><span>Chg%</span></div>
    <div id="wlBody" class="wl-body"></div>
    <div id="detail"></div>
  </aside>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-head"><span id="modalTitle"></span><button class="modal-x" data-close>×</button></div>
    <div id="modalBody"></div>
  </div>
</div>

<script src="lib/lightweight-charts.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
